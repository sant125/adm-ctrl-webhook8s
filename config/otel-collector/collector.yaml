apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
# ServiceAccount com Workload Identity — o collector autentica no Cloud Trace
# usando o token OIDC do pod, sem chave JSON.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
  annotations:
    iam.gke.io/gcp-service-account: deployguard-operator@certquest.iam.gserviceaccount.com
---
# ConfigMap com a config do collector.
# receivers:  o que ele aceita (OTLP do nosso app)
# exporters:  pra onde ele manda (Cloud Trace)
# pipelines:  conecta receiver → exporter
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    # ==========================================================
    # RECEIVERS: o que o collector aceita na entrada.
    # Nosso app fala OTLP (HTTP em 4318, gRPC em 4317) — aceitamos os dois
    # pra ficar flexível (alguns SDKs usam um, outros usam outro).
    # ==========================================================
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317

    # ==========================================================
    # EXPORTERS: pra onde o collector manda. É AQUI que mora o "lock-in".
    # O APP continua vendor-neutral — só fala OTLP. Pra trocar backend,
    # mexe só nessa seção.
    # ==========================================================
    exporters:
      # TRACES → Tempo (OTLP gRPC nativo).
      otlp/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

      # MÉTRICAS → endpoint Prometheus-scrapeable.
      # Esse exporter é PULL, não push — expõe /metrics na :8889 e o Prometheus
      # (kube-prometheus-stack) vem buscar. OTEL nome "deployguard.admission.requests"
      # vira Prom "deployguard_admission_requests_total" automaticamente.
      #
      # Alternativa pra ambiente com Prometheus remoto: prometheusremotewrite.
      # Pull combina com o padrão já instalado do kube-prometheus-stack.
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          # Copia atributos do Resource (service.name, service.version) como
          # labels Prometheus. Assim filtras por service_name="deployguard".
          enabled: true

    # ==========================================================
    # PROCESSORS: transformações aplicadas no meio do pipeline.
    # batch agrupa observações antes de exportar — reduz I/O.
    # ==========================================================
    processors:
      batch:
        send_batch_size: 100
        timeout: 5s

    # ==========================================================
    # EXTENSIONS: componentes auxiliares (não entram em pipeline).
    # health_check vira o endpoint da readinessProbe.
    # ==========================================================
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    # ==========================================================
    # SERVICE: liga receivers → processors → exporters em PIPELINES.
    # Traces e Metrics são pipelines INDEPENDENTES — podem ter
    # processors e destinos diferentes.
    # ==========================================================
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: collector
          # Imagem contrib tem o exporter googlecloud embutido.
          image: otel/opentelemetry-collector-contrib:0.123.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - containerPort: 4317  # OTLP gRPC (traces + metrics)
            - containerPort: 4318  # OTLP HTTP (traces + metrics)
            - containerPort: 8889  # Prometheus exporter (scrape target)
            - containerPort: 13133 # health_check
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
# Jaeger all-in-one: storage em memória, UI + backend numa pod só.
# Para produção de verdade: usar Jaeger com Elasticsearch ou Cassandra.
# Para portfolio/dev: in-memory é suficiente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          ports:
            - containerPort: 16686  # UI
            - containerPort: 4317   # OTLP gRPC
            - containerPort: 4318   # OTLP HTTP
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
# Service interno — o deployguard aponta pra cá via OTEL_EXPORTER_OTLP_ENDPOINT.
# Annotations dizem ao Prometheus Operator pra fazer scrape direto (sem precisar
# de ServiceMonitor manual pra instalação simples).
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
  labels:
    # kube-prometheus-stack usa essa label pra descobrir alvos via ServiceMonitor
    # (quando a gente criar um mais tarde).
    app.kubernetes.io/name: otel-collector
  annotations:
    # Se você não usar ServiceMonitor, esses campos ligam o scrape legacy
    # (Prometheus vanilla). O kube-prometheus-stack prefere ServiceMonitor,
    # mas ter essas annotations é bom como fallback/documentação.
    prometheus.io/scrape: "true"
    prometheus.io/port: "8889"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    # Porta onde as métricas OTEL saem em formato Prometheus.
    # Acesse via kubectl port-forward svc/otel-collector -n observability 8889:8889
    # e curl localhost:8889/metrics pra conferir.
    - name: prom-metrics
      port: 8889
      targetPort: 8889
---
# ServiceMonitor — diz pro Prometheus Operator (kube-prometheus-stack) pra
# scrapear o collector. Só funciona se o Prometheus Operator estiver instalado.
# Se rodar sem kube-prometheus-stack, comenta esse bloco.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: observability
  labels:
    # Tem que bater com `serviceMonitorSelector` do Prometheus CRD.
    # kube-prometheus-stack com `serviceMonitorSelectorNilUsesHelmValues=false`
    # (ver bootstrap.sh) aceita ServiceMonitor de qualquer namespace sem selector.
    release: kube-prom
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  namespaceSelector:
    matchNames: [observability]
  endpoints:
    - port: prom-metrics       # referencia o `name` da porta no Service
      interval: 30s
      path: /metrics
