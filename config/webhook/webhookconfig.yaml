apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: deployguard-validating-webhook
webhooks:
  - name: validate.deployguard.io
    # admissionReviewVersions: versões do AdmissionReview que o webhook suporta.
    # Sempre inclua v1 — é o padrão atual.
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: deployguard-webhook-service
        namespace: deployguard-system
        path: /validate
        port: 9443
      # caBundle é preenchido pelo cert rotator automaticamente.
      # Deixamos vazio aqui — o rotator preenche na primeira execução.
      caBundle: ""
    rules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
        # CREATE e UPDATE — validamos nos dois casos.
        # DELETE e CONNECT não precisam de validação.
        operations: ["CREATE", "UPDATE"]
    # ========================================================
    # namespaceSelector + objectSelector: QUEM esse webhook afeta.
    #
    # Diferença conceitual:
    # - namespaceSelector: filtra por LABEL DO NAMESPACE do objeto.
    # - objectSelector:    filtra por LABEL DO PRÓPRIO OBJETO (o Deployment).
    #
    # Estratégia aqui: OPT-IN por label no namespace.
    # O webhook só é chamado se o namespace tiver `deployguard.io/enforce=enabled`.
    #
    # Por que opt-in e não "todos os namespaces menos system"?
    # - Segurança operacional: em cluster compartilhado você não quer impor policy
    #   em time alheio sem combinar. Label explícito = contrato consciente.
    # - Onboarding gradual: você habilita namespace por namespace, ganha confiança.
    # - Evita incidentes: se o webhook tiver bug, o blast radius é só quem optou.
    #
    # Como habilitar um namespace:
    #   kubectl label namespace production deployguard.io/enforce=enabled
    # ========================================================
    namespaceSelector:
      matchExpressions:
        # Opt-in: precisa do label pra valer.
        - key: deployguard.io/enforce
          operator: In
          values: ["enabled"]
        # Cinto-e-suspensório: mesmo que alguém labele kube-system por engano,
        # o webhook NUNCA roda em namespaces do sistema. Um bug do operator
        # travando criação de pods em kube-system = cluster dead.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - deployguard-system   # evita recursão do próprio operator
    # objectSelector vazio = qualquer Deployment dentro de um namespace opted-in.
    # Se um dia quiser "rodar só em Deployments com label X", botaria aqui.
    objectSelector:
      matchLabels: {}
    # failurePolicy: o que o API server faz quando NÃO consegue falar com o webhook
    # (timeout, pod caído, network policy barrando, cert inválido, etc).
    #
    # Fail    → API server REJEITA o request. "fail closed" — mais seguro.
    # Ignore  → API server APROVA o request sem chamar nós. "fail open" — mais disponível.
    #
    # Tradeoff real:
    # - Fail + webhook caído = ninguém consegue criar/atualizar Deployment. Seu
    #   operator vira um SPOF de deploys. Mitigar com: 2+ réplicas, PodDisruptionBudget,
    #   leader election (já temos), namespaceSelector excluindo kube-system (já temos).
    # - Ignore + webhook caído = requests passam sem validar. Admission de segurança
    #   que pode ser ignorada é só teatro — alguém pode derrubar o webhook de propósito.
    #
    # Regra prática: se o webhook EXISTE pra garantir segurança/compliance, use Fail.
    # Se é só enrichment/UX (labels, defaults), pode usar Ignore.
    # Como o DeployGuard bloqueia imagem :latest e exige resources, é política de
    # segurança → Fail.
    failurePolicy: Fail
    # sideEffects: nosso webhook não tem side effects — apenas lê e valida.
    sideEffects: None
    # timeoutSeconds: o API server aguarda no máximo esse tempo.
    # Se ultrapassar → failurePolicy é aplicado.
    # Máximo permitido pelo Kubernetes: 30s. Recomendado: 5-10s.
    timeoutSeconds: 5
