# ============================================================
# Namespaces de exemplo JÁ LABELADOS com opt-in do DeployGuard.
#
# A label deployguard.io/enforce=enabled é o gatilho do webhook
# (veja namespaceSelector em config/webhook/webhookconfig.yaml).
# Sem ela, o webhook nem é chamado — o namespace fica intacto.
#
# Pra habilitar um namespace existente:
#   kubectl label namespace <nome> deployguard.io/enforce=enabled
#
# Pra desabilitar (rollback rápido):
#   kubectl label namespace <nome> deployguard.io/enforce-
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    deployguard.io/enforce: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    deployguard.io/enforce: enabled
---
# ============================================================
# Exemplo 1: DeployPolicy para o namespace "production"
# Liga todas as regras — postura mais restritiva.
# ============================================================
apiVersion: deployguard.io/v1alpha1
kind: DeployPolicy
metadata:
  name: production-policy
  namespace: production
spec:
  # Rejeita Deployments sem resources.requests
  requireResources: true

  # Rejeita imagens com tag :latest ou sem tag
  blockLatestTag: true

  # Rejeita Deployments sem readinessProbe
  requireReadinessProbe: true
---
# ============================================================
# Exemplo 2: DeployPolicy mais permissiva para "staging"
# Só exige tag explícita. Resto é livre — é staging.
# ============================================================
apiVersion: deployguard.io/v1alpha1
kind: DeployPolicy
metadata:
  name: staging-policy
  namespace: staging
spec:
  blockLatestTag: true
---
# ============================================================
# Deployment RUIM — vai ser rejeitado pelo webhook em "production".
#
# Pra testar:
#   kubectl apply -f config/examples/demo.yaml
# O apply vai criar o namespace, a policy e até o good-deployment,
# mas vai FALHAR aqui com mensagem lista de violações.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deployment
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-app
  template:
    metadata:
      labels:
        app: bad-app
    spec:
      containers:
        - name: app
          image: nginx:latest      # BLOQUEADO: tag :latest
          ports:
            - containerPort: 80
          # sem resources          → BLOQUEADO: requireResources
          # sem readinessProbe     → BLOQUEADO: requireReadinessProbe
---
# ============================================================
# Deployment BOM — passa por todas as regras.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deployment
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: good-app
  template:
    metadata:
      labels:
        app: good-app
    spec:
      containers:
        - name: app
          image: nginx:1.25.3      # tag explícita
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
